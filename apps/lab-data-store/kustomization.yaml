# Lab Data Store: Postgres + TimescaleDB, nightly backup and the token-authenticated ingest API.
# Source of the image: JamilCPU/lab-data-store (scripts/build-push.sh on the primary node). Bump the tag here.
# Out-of-band prerequisite: Secret `lab-data-store` (scripts/make-secret.sh in that repo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
commonLabels:
  app.kubernetes.io/part-of: lab-data-store
resources:
  - postgres.yaml
  - backup.yaml
  - ingest-sources.yaml
  - ingest-api.yaml
images:
  - name: registry.lab/lab/ingest-api
    newTag: b2e83c3
