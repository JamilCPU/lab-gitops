# Ingest API: the only write path into the store. Devices POST batches with a per-device bearer token.
# The pod is split by privilege. The initContainer `bootstrap` (`store-admin bootstrap`) alone holds the
# Postgres superuser DSN and every role password; it applies the store migrations and provisions the
# per-source roles and grants, then exits. The HTTP container `ingest-api` gets only the `ingest` role's
# password and DSN, so a compromised API process holds no admin credentials. `store-admin token ...`
# (kubectl exec -c ingest-api) works with that same ingest DSN. If bootstrap fails the pod stays in Init
# and Flux `wait: true` stalls the apps: check `kubectl -n lab logs deploy/ingest-api -c bootstrap`.
# Needs Postgres up (readiness is /readyz, which checks the database; liveness waits 20 s). One replica
# by design: the rate limiter is in memory. Reachable at ingest.lab over TLS.
# NOTE: the sources file is mounted with subPath, so a ConfigMap-only change does not reach the running pod:
# run `kubectl -n lab rollout restart deploy/ingest-api` after Flux applies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  labels: {app: ingest-api}
spec:
  replicas: 1
  strategy: {type: Recreate}   # in-memory rate limiter: one process only
  selector:
    matchLabels: {app: ingest-api}
  template:
    metadata:
      labels: {app: ingest-api}
    spec:
      # Floats on any node except the gateway/audio Pi (its hardware label marks it reserved); prefers the amd64 node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: hardware/bluetooth-usb, operator: DoesNotExist}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: bootstrap
          image: registry.lab/lab/ingest-api:e0f2b7d
          imagePullPolicy: IfNotPresent
          command: ["store-admin", "bootstrap"]
          env:
            # Order matters: $(VAR) references only expand variables defined earlier in the list.
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: POSTGRES_PASSWORD}}
            - name: INGEST_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: INGEST_PASSWORD}}
            - {name: STORE_ADMIN_DSN, value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/lab"}
            - {name: SOURCES_FILE, value: /etc/ingest-api/sources.yaml}
            # One owner/reader password pair per source registered in ingest-sources.yaml.
            - name: USAGE_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: USAGE_OWNER_PASSWORD}}
            - name: USAGE_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: USAGE_READER_PASSWORD}}
            - name: BANK_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: BANK_OWNER_PASSWORD}}
            - name: BANK_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: BANK_READER_PASSWORD}}
            - name: EMAIL_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: EMAIL_OWNER_PASSWORD}}
            - name: EMAIL_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: EMAIL_READER_PASSWORD}}
            - name: SMS_OWNER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: SMS_OWNER_PASSWORD}}
            - name: SMS_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: SMS_READER_PASSWORD}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: sources, mountPath: /etc/ingest-api/sources.yaml, subPath: sources.yaml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: ingest-api
          image: registry.lab/lab/ingest-api:e0f2b7d
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            # Order matters: $(VAR) references only expand variables defined earlier in the list.
            - name: INGEST_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-data-store, key: INGEST_PASSWORD}}
            - {name: STORE_INGEST_DSN, value: "postgresql://ingest:$(INGEST_PASSWORD)@postgres:5432/lab"}
            - {name: SOURCES_FILE, value: /etc/ingest-api/sources.yaml}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: sources, mountPath: /etc/ingest-api/sources.yaml, subPath: sources.yaml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: sources
          configMap: {name: ingest-sources}
        - name: tmp
          emptyDir: {}
---
# Named ingest-api, not ingest: a Service called `ingest` would shadow the ingest.lab name for pods in the namespace.
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  labels: {app: ingest-api}
spec:
  selector: {app: ingest-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# ingest.lab on :443 only. Traefik terminates TLS with the certificate cert-manager issues from the lab CA
# into Secret `ingest-lab-tls`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingest-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: lab-ca
spec:
  tls:
    - hosts: [ingest.lab]
      secretName: ingest-lab-tls
  rules:
    - host: ingest.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ingest-api, port: {name: http}}}}
