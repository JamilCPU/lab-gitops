apiVersion: v1
kind: Service
metadata:
  name: gitea
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
# git-over-SSH on <ingress node>:2222
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
spec:
  type: LoadBalancer
  selector: {app: gitea}
  ports:
    - {name: ssh, port: 2222, targetPort: ssh}
