apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  annotations:
    # plain HTTP only: if registry.lab also answered on :443 with Traefik's default cert,
    # clients would pick https and Gitea would hand out an https token realm they can't verify.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: gitea.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: gitea, port: {name: http}}}}
    - host: registry.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: gitea, port: {name: http}}}}
