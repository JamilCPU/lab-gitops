# automations.lab / mcp.automations.lab on :443, TLS passed straight through to the hub/MCP
# (they terminate TLS themselves with the pinned hub cert). Direct :7700/:7702 keep working too.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: personal-automations
spec:
  entryPoints: [websecure]
  routes:
    - match: HostSNI(`automations.lab`)
      services:
        - {name: pa-hub, port: 7700}
    - match: HostSNI(`mcp.automations.lab`)
      services:
        - {name: pa-mcp, port: 7702}
  tls:
    passthrough: true
