# cert-manager issues *.lab certificates from the lab-internal CA (see ../../infrastructure-config/lab-ca).
# Pinned to the primary worker: it has internet access to pull images and is the Traefik node.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    nodeSelector: &node
      role: primary-worker
    webhook:
      nodeSelector: *node
    cainjector:
      nodeSelector: *node
    startupapicheck:
      nodeSelector: *node
    resources:
      requests: {cpu: 10m, memory: 64Mi}
