# One DNS server per node labelled lab-dns=true, listening on that node's LAN address:53.
# Point the router's DHCP "DNS server" at those nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lab-dns
  labels: {app: lab-dns}
spec:
  selector:
    matchLabels: {app: lab-dns}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: lab-dns}
    spec:
      nodeSelector:
        lab-dns: "true"
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      containers:
        - name: coredns
          image: coredns/coredns:1.12.1
          args: ["-conf", "/etc/coredns/Corefile"]
          env:
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          envFrom:
            - configMapRef: {name: lab-network}
          ports:
            - {name: dns, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: 8181}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8091}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - {name: config, mountPath: /etc/coredns, readOnly: true}
      volumes:
        - name: config
          configMap: {name: corefile}
