# LAN DNS for the home lab.
#  - <anything>.lab  -> the ingress node (Traefik), so every app is reachable as <name>.lab
#  - everything else -> forwarded upstream
# Node-specific values come from env (the out-of-band ConfigMap `lab-network`,
# see bootstrap/k3s/lab-network-config.sh), never from this repo.
#
# UPSTREAM_DNS must NEVER be the router that hands these nodes out as DNS via DHCP:
# that router may use the same servers for its own lookups, so router -> lab-dns -> router
# loops forever (this took the LAN's DNS down once). Use the router's upstream (e.g. the
# ISP gateway) as UPSTREAM_DNS and a public resolver as UPSTREAM_DNS_FALLBACK, tried in order.
apiVersion: v1
kind: ConfigMap
metadata:
  name: corefile
data:
  Corefile: |
    lab:53 {
        bind {$NODE_IP}
        template IN A {
            answer "{{ .Name }} 60 IN A {$LAB_INGRESS_IP}"
        }
        template IN AAAA {
            rcode NOERROR
        }
        errors
    }
    .:53 {
        bind {$NODE_IP}
        forward . {$UPSTREAM_DNS} {$UPSTREAM_DNS_FALLBACK} {
            policy sequential
            # Bound in-flight queries so a flood or loop answers REFUSED instead of
            # growing memory until the pod is OOM-killed.
            max_concurrent 500
        }
        loop
        cache 300
        errors
        health {$NODE_IP}:8091
        ready {$NODE_IP}:8181
    }
